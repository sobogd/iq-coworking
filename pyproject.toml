[project]
name = "iq-task"
version = "0.1.0"
description = "Batch code-task service: gRPC API, stage pipeline on MTPLX, edge bridge to VPS"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "grpcio>=1.60",
    "grpcio-tools>=1.60",
    "protobuf>=4.25",
]

[project.scripts]
iq-task = "iq_task.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["iq_task"]