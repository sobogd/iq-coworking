syntax = "proto3";
package iqt;

service Harness {
  rpc Ping(PingRequest) returns (PingResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc CreateTask(CreateTaskRequest) returns (Task);
  rpc GetTask(TaskRef) returns (Task);
  rpc ListTasks(ListRequest) returns (Tasks);
  rpc WatchTask(WatchRequest) returns (stream Task);
  rpc StopTask(TaskRef) returns (Task);
  rpc ResumeTask(TaskRef) returns (Task);
  rpc DeleteTask(TaskRef) returns (TaskRef);
  rpc ListRepos(ListRequest) returns (Repos);
  rpc GetArtifacts(TaskRef) returns (Artifacts);
}

message PingRequest {}

message PingResponse {
  int64 ts = 1;
  string version = 2;
}

message LoginRequest {
  string login = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
  int64 expires_at = 2;
}

message CreateTaskRequest {
  string text = 1;
  string repo = 2;
}

message TaskRef {
  string id = 1;
}

message ListRequest {}

message Tasks {
  repeated Task tasks = 1;
}

message Repo {
  string path = 1;
  bool exists = 2;
}

message Repos {
  repeated Repo repos = 1;
}

message Artifact {
  string name = 1;
  string content = 2;
  bool truncated = 3;
}

message Artifacts {
  repeated Artifact artifacts = 1;
}

message WatchRequest {
  string id = 1;
}

message Task {
  string id = 1;
  string text = 2;
  string repo = 3;
  string stage = 4;
  string status = 5;
  int32 build_index = 6;
  int32 builds_total = 7;
  string error = 8;
  int64 created_at = 9;
  int64 updated_at = 10;
  string stage_key = 11;
  int32 review_cycle = 12;
}
