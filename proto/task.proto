syntax = "proto3";
package iq;

service Harness {
  rpc Ping (PingRequest) returns (PingResponse);
  rpc Login (LoginRequest) returns (LoginResponse);
  rpc CreateSession (CreateSessionRequest) returns (Session);
  rpc GetSession (SessionRef) returns (Session);
  rpc ListSessions (ListRequest) returns (Sessions);
  rpc WatchSession (WatchRequest) returns (stream Session);
  rpc StopSession (SessionRef) returns (Session);
  rpc ResumeSession (SessionRef) returns (Session);
  rpc DeleteSession (SessionRef) returns (SessionRef);
  rpc SendMessage (MessageRequest) returns (Session);
  rpc GetActivity (SessionRef) returns (Activity);
  rpc ListDirs (DirsRequest) returns (Dirs);
  rpc Complete (CompleteRequest) returns (CompleteResponse);
}

message PingRequest {}
message PingResponse {
  string version = 1;
  int32 sessions = 2;
}

message LoginRequest { string token = 1; }
message LoginResponse { string token = 1; }

message CreateSessionRequest {
  string repo = 1;            // path to project dir; empty = home
  string system_prompt = 2;   // user system prompt, prepended
  string message = 3;         // first user message
  string thinking = 4;        // off low medium xhigh; default low
  int32 context_tokens = 5;   // context window; 0 = default 32k
}

message Session {
  string id = 1;
  string repo = 2;
  string system_prompt = 3;
  string title = 4;
  string status = 5;          // IDLE BUSY STOPPED FAILED
  string error = 6;
  int64 created_at = 7;
  int64 updated_at = 8;
  string thinking = 9;
  int32 context_tokens = 10;
}
message SessionRef { string id = 1; }
message ListRequest {}
message Sessions { repeated Session sessions = 1; }
message WatchRequest { string id = 1; }
message MessageRequest { string id = 1; string text = 2; }
message DirsRequest { string path = 1; }
message Dirs { string path = 1; repeated string dirs = 2; }
message CompleteRequest { string id = 1; string text = 2; }
message CompleteResponse { string text = 1; }

message ActivityMessage {
  string role = 1;
  string content = 2;
  repeated string tool_calls = 3;
  string reasoning = 4;
}
message Activity { repeated ActivityMessage messages = 1; bool more = 2; }