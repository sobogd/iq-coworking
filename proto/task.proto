syntax = "proto3";
package iqt;

service Harness {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc CreateTask(CreateTaskRequest) returns (Task);
  rpc GetTask(TaskRef) returns (Task);
  rpc ListTasks(ListRequest) returns (Tasks);
  rpc WatchTask(WatchRequest) returns (stream Task);
  rpc StopTask(TaskRef) returns (Task);
  rpc ResumeTask(TaskRef) returns (Task);
}

message LoginRequest {
  string login = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
  int64 expires_at = 2;
}

message CreateTaskRequest {
  string text = 1;
  string repo = 2;
}

message TaskRef {
  string id = 1;
}

message ListRequest {}

message Tasks {
  repeated Task tasks = 1;
}

message WatchRequest {
  string id = 1;
}

message Task {
  string id = 1;
  string text = 2;
  string repo = 3;
  string stage = 4;
  string status = 5;
  int32 build_index = 6;
  int32 builds_total = 7;
  string error = 8;
  int64 created_at = 9;
  int64 updated_at = 10;
}
